site_name: Projeto da Disciplina de IHC - Grupo 05
site_description: Documentação do projeto de Interação Humano-Computador do Grupo 05, FCTE/UnB, 2026.2.
site_author: Grupo 05 — IHC 2026.2
site_url: https://interacao-humano-computador.github.io/2026.2-Grupo05/

repo_url: https://github.com/Interacao-Humano-Computador/2026.2-Grupo05
repo_name: 2026.2-Grupo05
edit_uri: edit/main/docs/

copyright: Grupo 05 · Interação Humano-Computador · FCTE/UnB · 2026.2

theme:
  name: material
  language: pt-BR
  custom_dir: overrides
  icon:
    logo: material/home
  favicon: assets/favicon.png
  font:
    text: Outfit
    code: IBM Plex Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar modo escuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar modo claro

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Ligação permanente para esta seção
  - tables
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/a11y.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Interacao-Humano-Computador/2026.2-Grupo05
      name: Repositório do grupo no GitHub

not_in_nav: |
  contribuicoes/index.md

nav:
  - Inicial: index.md

  - Apresentações: apresentacoes/index.md

  - Atas:
    - Ata de reunião 1: atas/ata1.md
    - Ata de reunião 2: atas/ata2.md

  - Planejamento:
    - Cronograma: planejamento/cronograma.md
    - Ferramentas: planejamento/Ferramentas_do_Projeto.md
    - Mapa de disponibilidade: planejamento/HeatMap_do_Grupo.md
    - Sites avaliados: planejamento/selecao_v2.md
    - Site escolhido: planejamento/escolha-semob.md
    - Processo de design: planejamento/ProcessoDesign.md

  - Análise de Requisitos: analise-de-requisitos/index.md

  - Design, Avaliação e Desenvolvimento: design-avaliacao-desenvolvimento/index.md

  - Verificação: verificacao/index.md

  - Entrega Final: entrega-final/index.md
