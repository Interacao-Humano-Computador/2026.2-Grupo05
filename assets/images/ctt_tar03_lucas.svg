<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <!-- Cloud Path Definition -->
    <g id="cloud-icon">
      <path d="M 25,45 
               A 16,16 0 0,1 15,22 
               A 20,20 0 0,1 42,10 
               A 24,24 0 0,1 78,12 
               A 18,18 0 0,1 95,28 
               A 16,16 0 0,1 85,45 
               Z" 
            fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    </g>

    <!-- Monitor / System Task Icon -->
    <g id="system-icon">
      <rect x="0" y="0" width="44" height="30" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
      <rect x="4" y="4" width="36" height="22" rx="1" fill="#f0f0f0" stroke="#000000" stroke-width="1" />
      <path d="M 16,30 L 12,38 L 32,38 L 28,30 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- User / Person Task Icon -->
    <g id="user-icon">
      <circle cx="20" cy="10" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
      <path d="M 5,36 C 5,22 35,22 35,36 Z" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    </g>

    <!-- Interactive Task Icon (Monitor + Arrow + Person) -->
    <g id="interactive-icon">
      <!-- Monitor -->
      <rect x="0" y="4" width="30" height="22" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <rect x="3" y="7" width="24" height="16" rx="1" fill="#f0f0f0" stroke="#000000" stroke-width="0.8" />
      <path d="M 11,26 L 8,32 L 22,32 L 19,26 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
      <!-- Arrow -->
      <path d="M 33,18 L 41,18 M 38,14 L 42,18 L 38,22" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Person -->
      <circle cx="56" cy="11" r="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
      <path d="M 45,32 C 45,21 67,21 67,32 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    </g>

    <!-- Marker Arrow for Disabling [> -->
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" font-size="19" font-weight="bold" letter-spacing="1" fill="#000000">
    ÁRVORE DE TAREFAS CONCORRENTES (CTT) - PLANEJAMENTO DE ROTA COMPLETA
  </text>

  <!-- Root Task (Cloud) -->
  <g transform="translate(650, 55)">
    <use href="#cloud-icon" />
  </g>
  <text x="700" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Planejar viagem completa e acompanhar deslocamento em tempo real</text>

  <!-- Lines from Root to Level 1 -->
  <line x1="680" y1="135" x2="250" y2="185" stroke="#000000" stroke-width="1.5" />
  <line x1="700" y1="135" x2="700" y2="185" stroke="#000000" stroke-width="1.5" />
  <line x1="720" y1="135" x2="1150" y2="185" stroke="#000000" stroke-width="1.5" />

  <!-- Level 1 (3 Abstract Clouds) -->
  <!-- Branch 1 -->
  <g transform="translate(200, 185)">
    <use href="#cloud-icon" />
  </g>
  <text x="250" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">1</text>
  <text x="250" y="265" text-anchor="middle" font-size="13" fill="#000000">Informar destino e calcular rota</text>

  <!-- Operator between 1 and 2 -->
  <line x1="370" y1="230" x2="440" y2="230" stroke="#000000" stroke-width="1.5" />
  <rect x="440" y="220" width="40" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="460" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">[]&gt;&gt;</text>
  <line x1="480" y1="230" x2="550" y2="230" stroke="#000000" stroke-width="1.5" />

  <!-- Branch 2 -->
  <g transform="translate(650, 185)">
    <use href="#cloud-icon" />
  </g>
  <text x="700" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">2</text>
  <text x="700" y="265" text-anchor="middle" font-size="13" fill="#000000">Comparar opções e selecionar rota</text>

  <!-- Operator between 2 and 3 -->
  <line x1="820" y1="230" x2="890" y2="230" stroke="#000000" stroke-width="1.5" />
  <rect x="890" y="220" width="40" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="910" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">[]&gt;&gt;</text>
  <line x1="930" y1="230" x2="1000" y2="230" stroke="#000000" stroke-width="1.5" />

  <!-- Branch 3 -->
  <g transform="translate(1100, 185)">
    <use href="#cloud-icon" />
  </g>
  <text x="1150" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">3</text>
  <text x="1150" y="265" text-anchor="middle" font-size="13" fill="#000000">Realizar viagem e monitorar trajeto</text>


  <!-- ================= LEVEL 2 NODES ================= -->

  <!-- BRANCH 1 CHILDREN -->
  <!-- Line from Cloud 1 to 1.1, 1.2 -->
  <line x1="230" y1="270" x2="150" y2="340" stroke="#000000" stroke-width="1.5" />
  <line x1="270" y1="270" x2="350" y2="340" stroke="#000000" stroke-width="1.5" />

  <!-- Task 1.1: Interactive -->
  <g transform="translate(115, 345)">
    <use href="#interactive-icon" />
  </g>
  <text x="150" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[1.1]</text>
  <text x="150" y="415" text-anchor="middle" font-size="12" fill="#000000">Inserir destino e</text>
  <text x="150" y="430" text-anchor="middle" font-size="12" fill="#000000">confirmar origem</text>

  <!-- Operator between 1.1 and 1.2 -->
  <line x1="205" y1="365" x2="230" y2="365" stroke="#000000" stroke-width="1.2" />
  <rect x="230" y="356" width="36" height="18" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="248" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">[]&gt;&gt;</text>
  <line x1="266" y1="365" x2="295" y2="365" stroke="#000000" stroke-width="1.2" />

  <!-- Task 1.2: System -->
  <g transform="translate(328, 345)">
    <use href="#system-icon" />
  </g>
  <text x="350" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[1.2]</text>
  <text x="350" y="415" text-anchor="middle" font-size="12" fill="#000000">Calcular rota inteira,</text>
  <text x="350" y="430" text-anchor="middle" font-size="12" fill="#000000">caminhada e ETA</text>


  <!-- BRANCH 2 CHILDREN -->
  <!-- Line from Cloud 2 to 2.1, 2.2 -->
  <line x1="680" y1="270" x2="600" y2="340" stroke="#000000" stroke-width="1.5" />
  <line x1="720" y1="270" x2="800" y2="340" stroke="#000000" stroke-width="1.5" />

  <!-- Task 2.1: User -->
  <g transform="translate(580, 345)">
    <use href="#user-icon" />
  </g>
  <text x="600" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[2.1]</text>
  <text x="600" y="415" text-anchor="middle" font-size="12" fill="#000000">Analisar opções</text>
  <text x="600" y="430" text-anchor="middle" font-size="12" fill="#000000">e melhor parada</text>

  <!-- Operator between 2.1 and 2.2 -->
  <line x1="645" y1="365" x2="675" y2="365" stroke="#000000" stroke-width="1.2" />
  <rect x="675" y="356" width="30" height="18" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="690" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">&gt;&gt;</text>
  <line x1="705" y1="365" x2="735" y2="365" stroke="#000000" stroke-width="1.2" />

  <!-- Task 2.2: Interactive -->
  <g transform="translate(765, 345)">
    <use href="#interactive-icon" />
  </g>
  <text x="800" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[2.2]</text>
  <text x="800" y="415" text-anchor="middle" font-size="12" fill="#000000">Selecionar rota e</text>
  <text x="800" y="430" text-anchor="middle" font-size="12" fill="#000000">iniciar trajeto</text>


  <!-- BRANCH 3 CHILDREN -->
  <!-- Line from Cloud 3 to 3.1, 3.2, 3.3 -->
  <line x1="1130" y1="270" x2="1030" y2="340" stroke="#000000" stroke-width="1.5" />
  <line x1="1150" y1="270" x2="1165" y2="340" stroke="#000000" stroke-width="1.5" />
  <line x1="1170" y1="270" x2="1300" y2="340" stroke="#000000" stroke-width="1.5" />

  <!-- Task 3.1: User -->
  <g transform="translate(1010, 345)">
    <use href="#user-icon" />
  </g>
  <text x="1030" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[3.1]</text>
  <text x="1030" y="415" text-anchor="middle" font-size="12" fill="#000000">Caminhar ao ponto</text>
  <text x="1030" y="430" text-anchor="middle" font-size="12" fill="#000000">e embarcar</text>

  <!-- Operator between 3.1 and 3.2 -->
  <line x1="1065" y1="365" x2="1085" y2="365" stroke="#000000" stroke-width="1.2" />
  <rect x="1085" y="356" width="30" height="18" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="1100" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">|||</text>
  <line x1="1115" y1="365" x2="1135" y2="365" stroke="#000000" stroke-width="1.2" />

  <!-- Task 3.2: System -->
  <g transform="translate(1143, 345)">
    <use href="#system-icon" />
  </g>
  <text x="1165" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[3.2]</text>
  <text x="1165" y="415" text-anchor="middle" font-size="12" fill="#000000">Rastrear veículo e</text>
  <text x="1165" y="430" text-anchor="middle" font-size="12" fill="#000000">atualizar previsão</text>

  <!-- Operator between 3.2 and 3.3 (Disabling / Contingency) -->
  <path d="M 1205,355 Q 1235,335 1260,355" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#dash-arrow)" />
  <rect x="1225" y="325" width="24" height="16" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
  <text x="1237" y="337" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">[&gt;</text>

  <!-- Task 3.3: Interactive -->
  <g transform="translate(1265, 345)">
    <use href="#interactive-icon" />
  </g>
  <text x="1300" y="398" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">[3.3]</text>
  <text x="1300" y="415" text-anchor="middle" font-size="12" fill="#000000">Alertar descida ou</text>
  <text x="1300" y="430" text-anchor="middle" font-size="12" fill="#000000">acionar desvio</text>


  <!-- Legend at Bottom -->
  <rect x="250" y="490" width="900" height="65" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" />
  <text x="700" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">Legenda da Notação ConcurTaskTrees (CTT)</text>
  <text x="700" y="532" text-anchor="middle" font-size="12" fill="#555555">☁️ Tarefa Abstrata | 👤 Tarefa do Usuário | 🖥️ Tarefa do Sistema | 🖥️➔👤 Tarefa Interativa | []&gt;&gt; Passagem de Informação | &gt;&gt; Sequência | ||| Concorrência | [&gt; Desativação</text>
</svg>
