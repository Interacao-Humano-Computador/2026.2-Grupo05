<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="19" font-weight="bold" letter-spacing="1" fill="#000000">
    ANÁLISE HIERÁRQUICA DE TAREFAS (HTA) - PLANEJAMENTO DE ROTA COMPLETA
  </text>

  <!-- Level 0 (Root) -->
  <g id="node-0">
    <rect x="360" y="70" width="480" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="600" y="93" text-anchor="middle" font-size="14" fill="#000000">0. Planejar viagem porta a porta por destino e acompanhar rota em tempo real</text>
    <text x="600" y="113" text-anchor="middle" font-size="13" fill="#000000">1 &gt; 2 &gt; 3</text>
  </g>

  <!-- Connector Level 0 to Level 1 -->
  <line x1="600" y1="126" x2="600" y2="155" stroke="#000000" stroke-width="1.5" />
  <line x1="200" y1="155" x2="1000" y2="155" stroke="#000000" stroke-width="1.5" />
  <line x1="200" y1="155" x2="200" y2="182" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="155" x2="600" y2="182" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1000" y1="155" x2="1000" y2="182" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Level 1 (Branches 1, 2, 3) -->
  <!-- Branch 1 -->
  <g id="node-1">
    <rect x="50" y="185" width="300" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="200" y="209" text-anchor="middle" font-size="13.5" fill="#000000">1. Informar destino e calcular</text>
    <text x="200" y="227" text-anchor="middle" font-size="13.5" fill="#000000">rota completa porta a porta</text>
    <text x="200" y="244" text-anchor="middle" font-size="13" fill="#000000">1.1 &gt; 1.2</text>
  </g>

  <!-- Branch 2 -->
  <g id="node-2">
    <rect x="450" y="185" width="300" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="600" y="209" text-anchor="middle" font-size="13.5" fill="#000000">2. Comparar opções e selecionar a</text>
    <text x="600" y="227" text-anchor="middle" font-size="13.5" fill="#000000">melhor combinação de parada e linha</text>
    <text x="600" y="244" text-anchor="middle" font-size="13" fill="#000000">2.1 &gt; 2.2</text>
  </g>

  <!-- Branch 3 -->
  <g id="node-3">
    <rect x="850" y="185" width="300" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="1000" y="209" text-anchor="middle" font-size="13.5" fill="#000000">3. Realizar trajeto até a parada e</text>
    <text x="1000" y="227" text-anchor="middle" font-size="13.5" fill="#000000">monitorar viagem até o destino</text>
    <text x="1000" y="244" text-anchor="middle" font-size="13" fill="#000000">3.1 / 3.2</text>
  </g>

  <!-- Connectors Level 1 to Level 2 -->
  <!-- Branch 1 connectors -->
  <line x1="200" y1="251" x2="200" y2="280" stroke="#000000" stroke-width="1.5" />
  <line x1="115" y1="280" x2="285" y2="280" stroke="#000000" stroke-width="1.5" />
  <line x1="115" y1="280" x2="115" y2="307" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="285" y1="280" x2="285" y2="307" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Branch 2 connectors -->
  <line x1="600" y1="251" x2="600" y2="280" stroke="#000000" stroke-width="1.5" />
  <line x1="515" y1="280" x2="685" y2="280" stroke="#000000" stroke-width="1.5" />
  <line x1="515" y1="280" x2="515" y2="307" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="685" y1="280" x2="685" y2="307" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Branch 3 connectors -->
  <line x1="1000" y1="251" x2="1000" y2="280" stroke="#000000" stroke-width="1.5" />
  <line x1="915" y1="280" x2="1085" y2="280" stroke="#000000" stroke-width="1.5" />
  <line x1="915" y1="280" x2="915" y2="307" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1085" y1="280" x2="1085" y2="307" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Level 2 (Terminal Leaf Operations with Double Bottom Line) -->
  <!-- 1.1 -->
  <g id="node-1-1">
    <rect x="35" y="310" width="160" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="35" y1="414" x2="195" y2="414" stroke="#000000" stroke-width="1.5" />
    <text x="115" y="338" text-anchor="middle" font-size="12.5" fill="#000000">1.1. Inserir local</text>
    <text x="115" y="356" text-anchor="middle" font-size="12.5" fill="#000000">de destino e</text>
    <text x="115" y="374" text-anchor="middle" font-size="12.5" fill="#000000">validar ponto de</text>
    <text x="115" y="392" text-anchor="middle" font-size="12.5" fill="#000000">partida (GPS)</text>
  </g>

  <!-- 1.2 -->
  <g id="node-1-2">
    <rect x="205" y="310" width="160" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="205" y1="414" x2="365" y2="414" stroke="#000000" stroke-width="1.5" />
    <text x="285" y="338" text-anchor="middle" font-size="12.5" fill="#000000">1.2. Processar</text>
    <text x="285" y="356" text-anchor="middle" font-size="12.5" fill="#000000">cálculo da rota</text>
    <text x="285" y="374" text-anchor="middle" font-size="12.5" fill="#000000">inteira (caminhada,</text>
    <text x="285" y="392" text-anchor="middle" font-size="12.5" fill="#000000">paradas e viagem)</text>
  </g>

  <!-- 2.1 -->
  <g id="node-2-1">
    <rect x="435" y="310" width="160" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="435" y1="414" x2="595" y2="414" stroke="#000000" stroke-width="1.5" />
    <text x="515" y="338" text-anchor="middle" font-size="12.5" fill="#000000">2.1. Comparar</text>
    <text x="515" y="356" text-anchor="middle" font-size="12.5" fill="#000000">opções (tempo de</text>
    <text x="515" y="374" text-anchor="middle" font-size="12.5" fill="#000000">caminhada, parada,</text>
    <text x="515" y="392" text-anchor="middle" font-size="12.5" fill="#000000">linha e ETA final)</text>
  </g>

  <!-- 2.2 -->
  <g id="node-2-2">
    <rect x="605" y="310" width="160" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="605" y1="414" x2="765" y2="414" stroke="#000000" stroke-width="1.5" />
    <text x="685" y="338" text-anchor="middle" font-size="12.5" fill="#000000">2.2. Selecionar</text>
    <text x="685" y="356" text-anchor="middle" font-size="12.5" fill="#000000">trajeto preferencial</text>
    <text x="685" y="374" text-anchor="middle" font-size="12.5" fill="#000000">para iniciar a</text>
    <text x="685" y="392" text-anchor="middle" font-size="12.5" fill="#000000">navegação</text>
  </g>

  <!-- 3.1 -->
  <g id="node-3-1">
    <rect x="835" y="310" width="160" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="835" y1="414" x2="995" y2="414" stroke="#000000" stroke-width="1.5" />
    <text x="915" y="338" text-anchor="middle" font-size="12.5" fill="#000000">3.1. Seguir</text>
    <text x="915" y="356" text-anchor="middle" font-size="12.5" fill="#000000">caminhada até a</text>
    <text x="915" y="374" text-anchor="middle" font-size="12.5" fill="#000000">parada e embarcar</text>
    <text x="915" y="392" text-anchor="middle" font-size="12.5" fill="#000000">no ônibus real</text>
  </g>

  <!-- 3.2 -->
  <g id="node-3-2">
    <rect x="1005" y="310" width="160" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="1005" y1="414" x2="1165" y2="414" stroke="#000000" stroke-width="1.5" />
    <text x="1085" y="338" text-anchor="middle" font-size="12.5" fill="#000000">3.2. Acompanhar</text>
    <text x="1085" y="356" text-anchor="middle" font-size="12.5" fill="#000000">viagem a bordo</text>
    <text x="1085" y="374" text-anchor="middle" font-size="12.5" fill="#000000">até o destino ou</text>
    <text x="1085" y="392" text-anchor="middle" font-size="12.5" fill="#000000">acionar desvio</text>
  </g>

  <!-- Legend Box at Bottom -->
  <rect x="250" y="470" width="700" height="60" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="4" />
  <text x="600" y="492" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333333">Legenda das Relações e Operações HTA</text>
  <text x="600" y="512" text-anchor="middle" font-size="12" fill="#555555">&gt; Sequência estrita | / Seleção de alternativa | + Paralelo | Blocos com linha dupla inferior = Operações terminais (Folhas)</text>
</svg>
